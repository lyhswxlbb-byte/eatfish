<!DOCTYPE html><html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>京东家装跑量素材逐条拆分复盘</title>
  <link rel="stylesheet" href="assets/000_styles.css">
</head>
<body>
  <main>
    <section class="hero"><div class="hero-inner">
      <div class="eyebrow">✦ 跑量素材拆分 · 京东家装</div>
      <h1>京东家装跑量素材<br><span>逐条视频拆分复盘</span></h1>
      <p>基于 95 条真实跑量素材，逐条打开抖音视频，结合消耗、CTR、CVR 与 PVR 拆解素材形式、开头钩子、内容卖点和优化方向。</p>
      <div class="hero-pills"><span>95 条全量核验</span><span>94 条成功分析</span><span>48 条优质素材</span><span>47 条待优化素材</span></div>
    </div></section>
    <div class="content">
      <section id="summary" class="summary-grid"></section>
      <section class="compare-panel">
        <div class="section-head"><div><span class="kicker">PERFORMANCE SNAPSHOT</span><h2>优质 vs 待优化 · 表现差异</h2></div><p id="method"></p></div>
        <div id="comparison" class="comparison"></div>
      </section>
      <section class="library">
        <div class="section-head library-head"><div><span class="kicker">VIDEO LIBRARY</span><h2>逐条素材拆解</h2></div><span id="result-count" class="result-count"></span></div>
        <div id="tabs" class="tabs"></div>
        <div class="toolbar"><div class="search-box">⌕<input id="search" aria-label="搜索素材" placeholder="搜索标题、作者、视频 ID 或卖点"></div><div class="sort">☷<select id="sort"><option value="score">按综合分排序</option><option value="spend">按消耗排序</option><option value="ctr">按 CTR 排序</option></select></div></div>
        <div id="cards" class="cards"></div>
      </section>
      <section class="notes"><span>⚠</span><div><b>口径与异常说明</b><p>本页按当前 95 条样本的综合表现中位数拆分优质与待优化；其中 1 条原链接跳转至另一视频，为避免误判已标记异常。每张卡片均保留原抖音链接，可直接点开复核。</p></div></section>
    </div>
  </main>
  <div id="drawer-mask" class="drawer-mask" hidden=""><aside id="drawer" class="drawer"></aside></div>
  <script src="assets/001_app.js"></script>


</body></html>
