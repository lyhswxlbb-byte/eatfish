<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ulike 红光护发防脱高速吹风机｜品星整合提案</title>
<style>
:root{
  --paper:#F5F0E6; --paper2:#EFE7D8; --paper3:#E7DECB;
  --ink:#1C2925; --ink2:#3B4742; --ink3:#6E6A5E;
  --teal:#0F5C50; --teal2:#2E8374; --teal-soft:#DCE8E2;
  --gold:#C2A15A; --gold2:#A8854A;
  --red:#C0472F; --red2:#D9775E; --red-soft:#F0D9CC;
  --line:#D7CDB9; --white:#FBF8F1;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;width:100%;overflow:hidden;background:#10171509;background:#141b18;font-family:var(--sans);color:var(--ink);}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#stage{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--paper);overflow:hidden;
  box-shadow:0 0 80px rgba(0,0,0,.45);}
@media (max-aspect-ratio:16/9){#stage{width:177.78vh;height:100vh;}}
.slide{position:absolute;inset:0;display:none;padding:3.4vw 4.6vw 4.2vw;background:var(--paper);overflow:hidden;}
.slide.active{display:block;animation:fade .55s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(1.2vh)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.slide.active{animation:none}}

/* ---------- shared atoms ---------- */
.kicker{font-size:.78vw;letter-spacing:.42em;color:var(--gold2);font-weight:700;text-transform:uppercase;margin-bottom:1.1vw;}
.chap-no{font-family:var(--serif);font-size:1.05vw;color:var(--teal);letter-spacing:.2em;margin-bottom:.5vw;font-weight:700;}
h1.st{font-family:var(--serif);font-size:3.15vw;line-height:1.18;color:var(--ink);font-weight:700;letter-spacing:.01em;}
h2.st{font-family:var(--serif);font-size:2.35vw;line-height:1.22;font-weight:700;color:var(--ink);}
.st .em{color:var(--teal);} .st .red{color:var(--red);}
.sub{font-size:1.02vw;color:var(--ink3);line-height:1.7;margin-top:1vw;}
.head-rule{width:3.4vw;height:.26vw;background:var(--gold);margin:1.1vw 0 1.4vw;border:none;}
.src{position:absolute;left:4.6vw;right:4.6vw;bottom:1.5vw;font-size:.62vw;color:#9B937F;line-height:1.5;border-top:1px solid var(--line);padding-top:.55vw;}
.src b{color:var(--gold2);font-weight:600;}
.grid{display:grid;gap:1.1vw;}
.card{background:var(--white);border:1px solid var(--line);border-radius:.7vw;padding:1.25vw 1.35vw;box-shadow:0 .25vw .9vw rgba(60,50,30,.06);}
.card.dark{background:var(--ink);color:#EDE6D6;border-color:var(--ink);}
.card.teal{background:var(--teal);color:#F3EFE4;border-color:var(--teal);}
.card.redcard{background:linear-gradient(135deg,#7E2C1C,#C0472F);color:#FBF3EA;border:none;}
.card h3{font-family:var(--serif);font-size:1.18vw;margin-bottom:.55vw;font-weight:700;}
.card p,.card li{font-size:.82vw;line-height:1.62;color:var(--ink2);}
.card.dark p,.card.dark li,.card.teal p,.card.teal li,.card.redcard p,.card.redcard li{color:rgba(243,239,228,.86);}
.card ul{padding-left:1.05vw;} .card li{margin-bottom:.3vw;}
.tag{display:inline-block;font-size:.62vw;padding:.18vw .6vw;border-radius:2vw;font-weight:700;letter-spacing:.05em;}
.tag.teal{background:var(--teal-soft);color:var(--teal);}
.tag.gold{background:#F1E6CE;color:var(--gold2);}
.tag.red{background:var(--red-soft);color:var(--red);}
.tag.grey{background:#E8E2D4;color:var(--ink3);}
.big-num{font-family:var(--serif);font-size:3.0vw;font-weight:700;color:var(--teal);line-height:1;}
.big-num.red{color:var(--red);} .big-num.gold{color:var(--gold2);}
.unit{font-size:.72vw;color:var(--ink3);margin-top:.45vw;line-height:1.5;}

/* ---------- chrome ---------- */
#hud{position:absolute;right:4.6vw;bottom:1.25vw;display:flex;align-items:center;gap:1vw;z-index:30;}
#pager{font-family:var(--serif);font-size:.85vw;color:var(--ink2);letter-spacing:.15em;}
#pager b{color:var(--teal);font-size:1.05vw;}
.nav-btn{width:2.1vw;height:2.1vw;border:1px solid var(--line);border-radius:50%;background:var(--white);color:var(--teal);
  font-size:1vw;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;}
.nav-btn:hover{background:var(--teal);color:#fff;border-color:var(--teal);}
#progress{position:absolute;left:0;top:0;height:.28vw;background:linear-gradient(90deg,var(--teal),var(--gold));z-index:30;transition:width .45s ease;}
#chapTag{position:absolute;left:4.6vw;top:1.9vw;font-size:.7vw;letter-spacing:.3em;color:var(--ink3);font-weight:700;z-index:20;}
#dots{position:absolute;right:1.4vw;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:.45vw;z-index:30;}
#dots i{width:.42vw;height:.42vw;border-radius:50%;background:#CFC6B2;cursor:pointer;transition:.25s;display:block;}
#dots i.on{background:var(--teal);transform:scale(1.5);}
#fsBtn{position:absolute;left:4.6vw;bottom:1.15vw;width:2vw;height:2vw;border:none;background:transparent;color:#B4AA94;cursor:pointer;font-size:1vw;z-index:30;}

/* ---------- cover ---------- */
.cover{background:radial-gradient(120% 100% at 78% 20%,#24473f 0%,#172622 52%,#101916 100%);color:#F2EDE2;padding:0!important;}
.cover .cv-inner{position:relative;z-index:5;padding:6vw 5.2vw;height:100%;display:flex;flex-direction:column;justify-content:center;}
.cover .kicker{color:var(--gold);}
.cover h1{font-family:var(--serif);font-size:4.0vw;line-height:1.22;font-weight:700;letter-spacing:.01em;max-width:60%;}
.cover h1 .gold{color:var(--gold);} .cover h1 .redglow{color:#F0927C;}
.cover .cv-sub{margin-top:1.6vw;font-size:1.05vw;line-height:1.9;color:rgba(242,237,226,.78);max-width:46%;}
.cover .cv-meta{margin-top:2.4vw;display:flex;gap:2.6vw;}
.cover .cv-meta div{border-left:2px solid var(--gold);padding-left:1vw;}
.cover .cv-meta .k{font-size:.68vw;letter-spacing:.25em;color:rgba(242,237,226,.55);margin-bottom:.4vw;}
.cover .cv-meta .v{font-family:var(--serif);font-size:1.15vw;color:#F2EDE2;}
.glow-ring{position:absolute;right:-6vw;top:50%;transform:translateY(-50%);width:42vw;height:42vw;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(224,120,90,.55) 0%,rgba(192,71,47,.28) 34%,rgba(192,71,47,.08) 58%,transparent 70%);
  filter:blur(.2vw);animation:breathe 5s ease-in-out infinite;}
.glow-ring::after{content:"";position:absolute;inset:22%;border-radius:50%;border:1px dashed rgba(240,146,124,.55);}
.glow-ring::before{content:"";position:absolute;inset:38%;border-radius:50%;border:1px solid rgba(240,146,124,.35);}
@keyframes breathe{0%,100%{opacity:.75;transform:translateY(-50%) scale(1)}50%{opacity:1;transform:translateY(-50%) scale(1.04)}}
.cv-foot{position:absolute;left:5.2vw;bottom:2.4vw;font-size:.7vw;letter-spacing:.2em;color:rgba(242,237,226,.45);z-index:6;}
@media (prefers-reduced-motion: reduce){.glow-ring{animation:none}}

/* ---------- layout helpers ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw;height:calc(100% - 7.5vw);}
.two-l{display:grid;grid-template-columns:1.15fr .85fr;gap:1.3vw;height:calc(100% - 7.5vw);}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1vw;}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:.9vw;}
.chart{width:100%;height:100%;min-height:0;}
.chart-wrap{background:var(--white);border:1px solid var(--line);border-radius:.7vw;padding:1vw 1vw .4vw;box-shadow:0 .25vw .9vw rgba(60,50,30,.06);}
.chart-wrap .ct{font-size:.82vw;font-weight:700;color:var(--ink);font-family:var(--serif);margin-bottom:.2vw;}
.chart-wrap .cn{font-size:.62vw;color:var(--ink3);margin-bottom:.3vw;}
.vstack{display:flex;flex-direction:column;gap:1vw;}
.fill{flex:1;min-height:0;}
table.tb{width:100%;border-collapse:collapse;font-size:.74vw;background:var(--white);border-radius:.6vw;overflow:hidden;}
table.tb th{background:var(--teal);color:#F3EFE4;font-weight:600;padding:.6vw .7vw;text-align:left;font-size:.7vw;letter-spacing:.03em;}
table.tb td{padding:.55vw .7vw;border-bottom:1px solid #E7DFCE;color:var(--ink2);line-height:1.45;vertical-align:top;}
table.tb tr:nth-child(even) td{background:#FAF6EC;}
table.tb td b{color:var(--ink);}
.verdict{display:flex;gap:1vw;align-items:stretch;}
.verdict .v-main{flex:1.4;background:var(--ink);color:#F2EDE2;border-radius:.7vw;padding:1.6vw 1.8vw;display:flex;flex-direction:column;justify-content:center;}
.verdict .v-side{flex:1;display:flex;flex-direction:column;gap:1vw;}
.v-main .lead{font-family:var(--serif);font-size:1.55vw;line-height:1.5;font-weight:700;}
.v-main .lead .gold{color:var(--gold);} .v-main .lead .red{color:#F0927C;}
.v-main .note{font-size:.8vw;color:rgba(242,237,226,.7);margin-top:.9vw;line-height:1.6;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.9vw;}
.light{width:.7vw;height:.7vw;border-radius:50%;display:inline-block;margin-right:.4vw;}
.light.r{background:var(--red);} .light.y{background:var(--gold);} .light.g{background:var(--teal2);}
.timeline{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:.8vw;margin-top:1.4vw;}
.timeline::before{content:"";position:absolute;left:1%;right:1%;top:.6vw;height:.16vw;background:var(--line);}
.tl-node{position:relative;padding-top:1.7vw;}
.tl-node::before{content:"";position:absolute;top:.15vw;left:0;width:1.05vw;height:1.05vw;border-radius:50%;background:var(--paper);border:.22vw solid var(--teal);z-index:2;}
.tl-node.hot::before{background:var(--red);border-color:var(--red);box-shadow:0 0 0 .3vw var(--red-soft);}
.tl-node .m{font-family:var(--serif);font-weight:700;font-size:.95vw;color:var(--ink);}
.tl-node .t{font-size:.68vw;color:var(--ink3);margin:.3vw 0 .5vw;letter-spacing:.1em;}
.tl-node .d{font-size:.68vw;color:var(--ink2);line-height:1.55;}
.persona{display:grid;grid-template-columns:repeat(3,1fr);gap:1vw;}
.mini-list li{font-size:.76vw;line-height:1.55;margin-bottom:.4vw;color:var(--ink2);}
.mini-list{padding-left:1.1vw;}
.matrix-dot{position:absolute;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:700;color:#fff;font-size:.72vw;text-align:center;line-height:1.1;}
.blocked{border:1.5px dashed #B98A7E;background:repeating-linear-gradient(135deg,#FBF3EE,#FBF3EE 1vw,#F7EAE2 1vw,#F7EAE2 2vw);border-radius:.7vw;padding:1.2vw 1.4vw;}
.blocked h3{color:var(--red);font-family:var(--serif);font-size:1.1vw;margin-bottom:.6vw;}
.blocked p,.blocked li{font-size:.76vw;color:#7A5A50;line-height:1.6;}
.quote{font-family:var(--serif);font-size:1.5vw;line-height:1.7;color:var(--ink);font-weight:700;}
.quote .red{color:var(--red);} .quote .teal{color:var(--teal);}
.foot-note{font-size:.66vw;color:var(--ink3);line-height:1.6;}
.dot-warn{display:inline-block;width:.72em;height:.72em;border-radius:50%;background:var(--red);margin-right:.4em;vertical-align:.04em;}
.dot-gold{display:inline-block;width:.72em;height:.72em;border-radius:50%;background:var(--gold);margin-right:.4em;vertical-align:.04em;}
#fsBtn{font-size:.62vw;letter-spacing:.1em;color:#B4AA94;}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="progress" style="width:0"></div>
  <div id="chapTag"></div>
  <div id="dots"></div>
  <button id="fsBtn" title="全屏">全屏</button>
  <div id="hud">
    <button class="nav-btn" id="prevBtn">‹</button>
    <span id="pager"><b>01</b> / 27</span>
    <button class="nav-btn" id="nextBtn">›</button>
  </div>
</div></div>
<script src="assets/000_echarts.min.js"></script>
<script src="assets/001_slides_a.js"></script>
<script src="assets/002_slides_b.js"></script>
<script src="assets/003_slides_c.js"></script>
<script src="assets/004_charts.js"></script>


</body></html>
